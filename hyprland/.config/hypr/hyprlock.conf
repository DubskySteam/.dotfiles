# ── Lockscreen ───────────────────────────────────────────────────────
# Plain black background, translucent clock + glass password pill.
# SUPER+SHIFT+L to lock.

background {
    monitor =
    path    =
    color   = rgb(0, 0, 0)
}

# ── Clock ────────────────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[sh -c 'date +"%H:%M"']
    font_family = JetBrainsMono Nerd Font
    font_size   = 95
    color       = rgba(255, 255, 255, 0.92)
    position    = 0, -140
    halign      = center
    valign      = top
}

label {
    monitor     =
    text        = cmd[sh -c 'date +"%A, %d %B"']
    font_family = JetBrainsMono Nerd Font
    font_size   = 20
    color       = rgba(255, 255, 255, 0.65)
    position    = 0, -250
    halign      = center
    valign      = top
}

# ── User + password pill ─────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[sh -c 'echo "$USER@$(hostname)"']
    font_family = JetBrainsMono Nerd Font
    font_size   = 18
    color       = rgba(255, 255, 255, 0.85)
    position    = 0, 42
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 320, 52
    outline_thickness = 2
    rounding          = 26
    dots_center       = true
    dots_size         = 0.25
    dots_spacing      = 0.6
    outer_color       = rgba(255, 255, 255, 0.35)
    inner_color       = rgba(255, 255, 255, 0.12)
    check_color       = rgba(158, 206, 106, 0.85)
    fail_color        = rgba(247, 118, 142, 0.9)
    fail_text         = <i>$FAIL</i>
    fail_timeout      = 2000
    font_color        = rgba(255, 255, 255, 0.92)
    fade_on_empty     = false
    placeholder_text  = <i>Enter Password</i>
    position          = 0, -30
    halign            = center
    valign            = center
}
