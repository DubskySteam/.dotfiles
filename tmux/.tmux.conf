# TMUX CONFIG

# Default shell
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh
set -sg escape-time 0

# Truecolor support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"

# Prefix to Control+A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Window split to Arrow keys
bind right split-window -h
bind down split-window -v
unbind '"'
unbind %

# Pane switching
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Quick reload
bind r source-file ~/.tmux.conf

# ---- Tokyo Night palette (matches waybar) ----
# bg       #1a1b26   status bar background
# bg-alt   #292e42   module / pill background
# fg       #c0caf5   primary text
# fg-dim   #565f89   muted text
# accent   #7aa2f7   blue highlight

# STATUS LINE
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-style bg=default,fg=#c0caf5
set -g status-left-length 40
set -g status-right-length 10

# LEFT - empty
set -g status-left ""

# MIDDLE - window tabs, active window as accent pill
setw -g window-status-style bg=default,fg=default
setw -g window-status-current-style bg=default,fg=default
setw -g window-status-format "#[bg=default,fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W #[fg=#7aa2f7,bg=default]#[bg=default]"
setw -g window-status-separator " "

# RIGHT - clean, no clock
set -g status-right ""

# PANE BORDERS - invisible so only the workspace pills show
set -g pane-border-style fg=default
set -g pane-active-border-style fg=default